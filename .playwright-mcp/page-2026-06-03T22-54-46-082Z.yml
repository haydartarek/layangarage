          - heading "Uw allround garagebedrijf in Beveren-Waas" [level=2] [ref=e80]
          - paragraph [ref=e81]: Layan Garage BV is een veelzijdig garagebedrijf dat een breed scala aan autogerelateerde diensten aanbiedt.
          - paragraph [ref=e82]: Bij onze garage in Beveren-Waas kunt u terecht voor het periodiek onderhoud van uw auto. Tijdens dit onderhoud wordt uw auto op diverse punten gecontroleerd. Indien nodig voeren wij reparaties uit of vervangen wij onderdelen, altijd in overleg met u. Dit houdt uw auto in optimale conditie en bevordert zowel de levensduur als uw veiligheid op de weg.
          - paragraph [ref=e83]: Onze garage is gecertificeerd en officieel erkend als reparateur van een groot aantal automerken.
          - paragraph [ref=e84]: Naast groot onderhoud kunt u hier ook terecht voor kleinere diensten, zoals airconditioning en band- en wielservices. Ook voor een grondige controle of reparatie van uw remmen staan onze monteurs klaar.
