              - paragraph [ref=e172]: Ongeacht het merk of type bent u welkom om langs te komen en de verkoop te bespreken. Na een korte inspectie van uw voertuig bespreken wij de prijs en voorwaarden. U ontvangt een eerlijke, marktconforme prijs die overeenkomt met de leeftijd en staat van uw auto.
              - paragraph [ref=e173]: Bent u akkoord met de prijs? Dan handelen wij de verkoop netjes af via een contract, zodat u zeker bent van een eerlijk en veilig verkoopproces.
              - paragraph [ref=e174]: Zoekt u een vervanging voor uw verkochte auto? Onze gecontroleerde tweedehandswagens zijn direct beschikbaar en uiteraard kunt u ook een proefrit maken.
