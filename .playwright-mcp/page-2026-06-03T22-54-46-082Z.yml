              - heading "Zoekt u een betrouwbare tweedehandswagen?" [level=3] [ref=e180]
              - paragraph [ref=e181]: Bent u op zoek naar een specifieke auto van een bepaald merk, bouwjaar of kleur? Heeft u een bepaald budget en wilt u zeker zijn dat de auto in perfecte staat is, zonder verborgen gebreken? Dan bent u bij Layan Garage aan het juiste adres.
              - paragraph [ref=e182]: Wij hebben een selectie tweedehandsauto's van diverse merken direct op voorraad. U bent welkom om de auto's te bekijken en specificaties en prijzen te bespreken. Alle voertuigen zijn grondig geïnspecteerd door ons team. Uiteraard is een proefrit mogelijk in overleg.
              - paragraph [ref=e183]: Heeft u uw droomauto gevonden? Denk er dan aan om ook voor uw periodiek onderhoud regelmatig bij onze garage langs te komen. Zo houdt u de auto in goede conditie en draagt u bij aan een langere levensduur.
