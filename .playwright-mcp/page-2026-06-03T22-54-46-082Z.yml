            - paragraph [ref=e157]: Voor iedereen die een tweedehands auto wil kopen of zijn huidige auto wil verkopen, is onze garage in Beveren-Waas de plek om naartoe te komen. Onze tweedehandsauto's worden door ervaren monteurs gecontroleerd en aangeboden tegen eerlijke, marktconforme prijzen.
            - paragraph [ref=e158]: Wilt u uw eigen auto verkopen? Dan kunt u rekenen op een transparante afhandeling en een realistisch bod dat de werkelijke waarde van uw voertuig weerspiegelt. U bent ook van harte welkom om een proefrit te maken in de auto van uw dromen.
